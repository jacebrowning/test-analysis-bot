[project]

name = "test-analysis-bot"
version = "0.1.3"
description = "Keep tabs on unreliable tests."
readme = "README.md"
license = "MIT"

requires-python = "^3.14"

[tool.poetry]

package-mode = false

[tool.poetry.dependencies]

# Web
django = "^6.0.8"
django-browser-reload = "^1.21"
django-cors-headers = "*"
django-crispy-forms = "^2.7"
crispy-bootstrap5 = "*" # styling for 'django-crispy-forms'
django-debug-toolbar = "^7.1"
django-tables2 = "^3.0.0"

# API
django-ninja = "^1.6.3"
pydantic = "^2.12.5"

# Storage
dj-database-url = "*"
psycopg2-binary = "^2.9.12"
redis = "^8.1.0"

# Integrations
mozilla-django-oidc = "^5.0.2"
pygithub = "^2.9.1"
slack-sdk = "^3.43.0"

# Utilities
django-extensions = "*"
django-user-agents = "^0.4.0"
markdown = "^3.10"
minilog = "*"
unidecode = "^1.4.0"

# Deployment
gunicorn = "^26.0.0"
whitenoise = "^6.12.0"

[tool.poetry.group.dev.dependencies]

# Formatting
black = "^26.5.0"
isort = "^8.0.0"
djlint = "^1.44.2"

# Linting
mypy = "^2.3"
django-stubs = { version = "^6.1.0", extras = ["compatible-mypy"] }
types-markdown = "*"
types-requests = "*"

# Testing
pytest = "^9.1.1"
pytest-describe = "^3.2"
pytest-expecter = "^3.1"
pytest-mock = "*"
pytest-randomly = "*"
pytest-django = "*"
pytest-playwright = "*"

# Coverage
pytest-cov = "*"
coveragespace = "^6.2"

# Utilities
pillow = "^12.3.0"
pixelmatch = "^0.4.0"
watchdog = "^6.0"

[tool.poetry.group.docs.dependencies]

# UML
pylint = "*"
pygraphviz = "*"

[tool.black]

quiet = true

[tool.isort]

profile = "black"

known_django = "django"
sections = "FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"

[tool.djlint]

profile = "django"

blank_line_before_tag = "block"
blank_line_after_tag = "load,extends,endblock"

quiet = true

[tool.mypy]

ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true

exclude = ".+/migrations/.+"

cache_dir = ".cache/mypy/"

plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]

django_settings_module = "config.settings.local"

[tool.pytest.ini_options]

DJANGO_SETTINGS_MODULE = "config.settings.test"

log_level = "DEBUG"

cache_dir = ".cache/pytest/"

addopts = """
--strict-markers
--pdbcls=tests.debugger:Debugger

--quiet
-r sxX
--show-capture=log

--fail-on-template-vars

--junit-xml=test-results/junit.xml

--cov=tab
--cov-report=html
--cov-report=term-missing:skip-covered
--no-cov-on-fail
"""

markers = []

filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
    "ignore::DeprecationWarning:pydantic._internal._config:",
    "ignore::DeprecationWarning:ninja.orm.metaclass:"
]
