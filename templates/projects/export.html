{% extends "base.html" %}

{% block content %}
    <div class="container mt-4 mb-5">
        <div class="mb-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h1 class="h4 mb-0">{{ heading }}</h1>
            <a href="{{ back_url }}" class="btn btn-sm btn-outline-dark">
                <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i>{{ back_label }}
            </a>
        </div>
        <div class="position-relative">
            <textarea id="export-body" class="d-none" aria-hidden="true" tabindex="-1">{{ export_body }}</textarea>
            <div class="position-absolute top-0 end-0 m-2 d-flex gap-1">
                <button type="button"
                        class="btn btn-sm btn-outline-secondary"
                        data-copy-prompt="export-body"
                        {% if not export_body %}disabled{% endif %}
                        title="Copy">
                    <span aria-hidden="true">
                        <i class="fa-regular fa-copy js-copy-prompt-idle"></i>
                        <i class="fa-solid fa-check js-copy-prompt-done d-none"></i>
                    </span>
                </button>
                <a href="{{ download_url }}"
                   class="btn btn-sm btn-outline-secondary{% if not download_url or not export_body %} disabled pe-none{% endif %}"
                   title="Download"
                   {% if not download_url or not export_body %}tabindex="-1"{% endif %}>
                    <i class="fa-solid fa-download" aria-hidden="true"></i>
                </a>
            </div>
            <pre class="p-3 bg-light border rounded small mb-0"
                 style="white-space: pre-wrap;
                        word-break: break-word;
                        padding-right: 5.5rem">{{ export_body }}</pre>
        </div>
    </div>
{% endblock content %}
