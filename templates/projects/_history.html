<div class="card border-info">
    <div class="card-header py-3 bg-info text-white">
        <h6 class="m-0 font-weight-bold">
            <i class="fa-solid fa-chart-line me-2"></i>
            Past Failure Rate
        </h6>
    </div>
    <div class="card-body">
        <div style="height: 300px;">
            <canvas id="failureRateChart"></canvas>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const ctx = document.getElementById('failureRateChart');
        if (ctx) {
            const chartData = {
                datasets: [{
                    data: [{% for point in history_data %}{x: '{{ point.date }}', y: parseFloat('{{ point.failure_rate|slice:":-1" }}')}{% if not forloop.last %}, {% endif %}{% endfor %}],
                    borderColor: '#0dcaf0',
                    borderWidth: 2,
                    fill: false,
                    pointRadius: 2,
                    pointHoverRadius: 4,
                }]
            };

            const config = {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    const dayIndex = context[0].dataIndex;
                                    const dayData = {{ history_data|safe }};
                                    const data = dayData[dayIndex];
                                    return data.date;
                                },
                                label: function(context) {
                                    const dayIndex = context.dataIndex;
                                    const dayData = {{ history_data|safe }};
                                    const data = dayData[dayIndex];
                                    return [
                                        `Failure Rate: ${data.failure_rate}`,
                                        `Block Rate: ${data.block_rate}`,
                                        `Avg Duration: ${data.average_duration}`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            }
                        },
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    day: 'M/dd'
                                },
                            },
                            grid: {
                                display: false
                            },

                        }
                    }
                }
            };
            new Chart(ctx, config);
        }
    });
</script>
