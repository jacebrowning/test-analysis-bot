<button type="button"
        class="btn btn-sm btn-outline-dark"
        title="View result details"
        data-bs-toggle="modal"
        data-bs-target="#details-{{ result.pk }}"
        data-result-id="{{ result.pk }}">
    <i class="fa-solid fa-maximize"></i>
</button>
<div class="modal fade" id="details-{{ result.pk }}" tabindex="-1">
    <div class="modal-dialog modal-xl wide-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title me-auto">Result Details</h5>
                <div class="d-flex align-items-center gap-3 flex-shrink-0 ms-2">
                    <div class="btn-group">
                        <button type="button"
                                class="btn btn-sm btn-outline-secondary"
                                data-copy-prompt="result-prompt-{{ result.pk }}"
                                disabled
                                title="Copy as Markdown">
                            <span aria-hidden="true">
                                <i class="fa-regular fa-copy js-copy-prompt-idle"></i>
                                <i class="fa-solid fa-check js-copy-prompt-done d-none"></i>
                            </span>
                            <span class="ms-1 d-none d-sm-inline">AI Prompt</span>
                        </button>
                        <button type="button"
                                class="btn btn-sm btn-outline-secondary dropdown-toggle dropdown-toggle-split"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                            <span class="visually-hidden">Toggle Dropdown</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item small"
                                   href="{% url 'projects:result-export-page' result.test.project.path result.test.id result.pk %}">Preview Content<i class="fa-solid fa-arrow-right ms-2" aria-hidden="true"></i></a>
                            </li>
                        </ul>
                    </div>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
            </div>
            <div class="modal-body">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
