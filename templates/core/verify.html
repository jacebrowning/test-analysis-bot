{% extends "base.html" %}

{% block messages_column_class %}col-lg-6{% endblock messages_column_class %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h1 class="h3 mb-0">Verify One-Time Password</h1>
                    </div>
                    <div class="card-body">
                        <p class="text-muted mb-4">
                            Please enter the one-time password sent to <strong>{{ email }}</strong>.
                        </p>
                        <form method="post"
                              action="{% url 'verify' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="otp" class="form-label">One-Time Password:</label>
                                <input type="text"
                                       class="form-control"
                                       id="otp"
                                       name="otp"
                                       {% if otp_value %}value="{{ otp_value }}"{% endif %}
                                       required>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-check me-1"></i>
                                    Verify
                                </button>
                                <a href="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}"
                                   class="btn btn-outline-secondary">
                                    <i class="fa-solid fa-arrow-left me-1"></i>
                                    Back to Login
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
